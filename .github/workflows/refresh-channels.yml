name: Refresh channels

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-channels
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check every channel and update the list
        run: python3 scripts/refresh_channels.py --update

      - name: Build the Mahsa configs
        run: python3 scripts/build_mahsa.py

      - name: Check the output files
        run: |
          test -s output/mahsa_configs.txt
          test -s output/mahsa_readable.txt
          test -s output/mahsa_xray_configs.json
          test -s output/channel_status.json
          python3 -c "import json; s=json.load(open('output/channel_status.json')); print('working channels:', s['working'], 'of', s['total'])"

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/ scripts/channels.txt
          git diff --cached --quiet && exit 0
          git commit -m "Refresh channels $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main
          git push origin HEAD:main
